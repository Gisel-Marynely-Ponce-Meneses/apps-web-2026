<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="formulario">
        <img class="logo" src="logo.png" alt="Logo">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo"> </p>
        <form method="post">
            <div class="username">
                <label for="usuario">Correo electrónico</label>
                <input type="email" id="usuario" required>
            </div>
            <div class="password">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" required>
            </div>
            <div class="recordar">
                <a href="#">Olvidé mi contraseña</a>
            </div>
            <input type="submit" value="Iniciar sesión">
            <div class="registrarse">
                <span>¿No tienes una cuenta?</span>
                <a href="#">Crear cuenta</a>
            </div>
        </form>
    </div>
</body>
</html>
